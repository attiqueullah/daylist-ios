# SwiftLint config for Daylist iOS. Runs on every build through the SwiftLintPlugins
# build-tool plugin (SPM). Target: 0 warnings; treat a new warning as a bug.

included:
  - Daylist
  - DaylistTests

excluded:
  - DerivedData
  - .build

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_optional_boolean
  - discouraged_optional_collection
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - private_swiftui_state
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - sorted_imports
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 250
  error: 400

function_body_length:
  warning: 50
  error: 80

identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y

trailing_comma:
  mandatory_comma: true

nesting:
  type_level: 2

reporter: xcode

custom_rules:
  no_hardcoded_ui_strings:
    name: "No hardcoded UI strings"
    message: "User-facing text must come from L10n (Localizable.xcstrings), not a string literal."
    included: ".*/Daylist/(Features|DesignSystem)/.*\\.swift"
    regex: '\b(Text|Button|Label|Toggle|TextField|SecureField|Section|Link|Menu|Picker|LabeledContent|ContentUnavailableView|PlaceholderScreen|PlaceholderAction|navigationTitle|accessibilityLabel|accessibilityHint|accessibilityValue|alert|confirmationDialog|help)\(\s*"'
    excluded_match_kinds:
      - comment
      - doccomment
    severity: warning
  no_literal_ui_argument:
    name: "No hardcoded UI strings"
    message: "User-facing text must come from L10n (Localizable.xcstrings), not a string literal."
    included: ".*/Daylist/(Features|DesignSystem)/.*\\.swift"
    regex: '\b(title|subtitle|message|note|label|placeholder|prompt):\s*"'
    excluded_match_kinds:
      - comment
      - doccomment
    severity: warning
